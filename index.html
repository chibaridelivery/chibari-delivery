 style="font-size:13px">独立版・軽量テスト</small></header><main class="wrap"><div class="tiles"><button class="tile" data-tab="map"><span>🗺️</span>マップ</button><button class="tile" data-tab="contacts"><span>📒</span>連絡先</button><button class="tile" data-tab="addresses"><span>🏪</span>店舗住所録</button><button class="tile" data-tab="schedule"><span>📋</span>配送予定</button><button class="tile" data-tab="photoImport"><span>📷</span>依頼書取込</button><button class="tile" data-tab="reports"><span>📝</span>日報</button><button class="tile" data-tab="monthly"><span>📊</span>月次集計</button><button class="tile" data-tab="invoice"><span>🧾</span>請求書</button><button class="tile" data-tab="backup"><span>💾</span>バックアップ</button></div><div class="notice">HTTPSの公開URLから開いて使用してください。ファイルを直接開く場合はデータ保存が保証されません。旧AppDeploy版とは別の試作です。旧アプリの「新アプリへ一括移行」から住所・連絡先・記録を取り込めます。データはこのブラウザ内に保存されます。定期的にJSONバックアップを保存してください。</div><section class="panel" id="panel"></section></main><script>
'use strict';const KEY='chibari_independent_v1';let data;try{data=JSON.parse(localStorage.getItem(KEY)||'null')}catch{}if(!data||typeof data!=='object'||Array.isArray(data))data={schedule:[],contacts:[],addresses:[],reports:[]};for(const k of ['schedule','contacts','addresses','reports'])if(!Array.isArray(data[k]))data[k]=[];const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>{try{const payload=JSON.stringify(data);localStorage.setItem(KEY,payload);if(localStorage.getItem(KEY)!==payload)throw Error('保存内容の検証に失敗');return true}catch(e){alert('保存できません。公開URLから開き、空き容量を確認してください。');return false}};let tab='schedule';let previewUrl=null;const cleanupPreview=()=>{if(previewUrl){URL.revokeObjectURL(previewUrl);previewUrl=null}};const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);const fields={schedule:[['date','日付','date'],['time','指定時刻','time'],['place','配送先・現場名','text'],['address','住所','text'],['person','担当者','text'],['phone','電話番号','tel'],['status','配送状況','select'],['note','備考','textarea']],contacts:[['name','名前・会社名','text'],['phone','電話番号','tel'],['note','備考','textarea']],addresses:[['name','店舗・現場名','text'],['address','住所','text'],['phone','電話番号','tel'],['note','備考','textarea']],reports:[['date','日付','date'],['driver','担当者','text'],['start','開始時刻','time'],['end','終了時刻','time'],['meterStart','開始メーター(km)','number'],['meterEnd','終了メーター(km)','number'],['breakMinutes','休憩(分)','number'],['deliveryCount','配送件数','number'],['toll','高速代(円)','number'],['fuelLiters','給油(L)','number'],['fuelYen','給油金額(円)','number'],['note','備考','textarea']]};let editingId=null;let listLimit=40;let scheduleFilter=today();const names={schedule:'配送予定',contacts:'連絡先',addresses:'店舗住所録',reports:'日報',backup:'バックアップ',map:'マップ',monthly:'月次集計',invoice:'請求書',photoImport:'依頼書取込'};function renderBase(){let p=$('#panel');if(tab==='photoImport'){
p.innerHTML=`<h2>📷 配送依頼書から予定表へ</h2><p class="muted">写真をこの画面だけで自動OCRする機能はまだありません。依頼書の写真をChatGPTへ送り、読み取った結果を下の欄に貼り付ければ、複数件を一括登録できます。</p><label>依頼書の写真を選ぶ（端末内でプレビューのみ）<input id="photoFile" type="file" accept="image/*" capture="environment"></label><div id="photoPreview"></div><label>配送日<input id="importDate" type="date" value="${today()}"></label><label>読み取った配送予定（1行につき1件）<textarea id="bulkText" style="min-height:180px" placeholder="09:00｜株式会社ABC｜京都市山科区○○1-2｜田中｜090-1234-5678｜納品\n11:30｜△△倉庫｜滋賀県大津市○○｜佐藤｜077-000-0000｜引取"></textarea></label><p class="muted">各行は「時刻｜配送先｜住所｜担当者｜電話｜備考」。区切りは ｜ またはタブ。時刻なしは「-」。ChatGPTに「この形式で配送予定を出して」と伝えてください。原本と照合してから登録してください。</p><button class="btn" id="previewBulk">登録前に確認</button><button class="btn" id="commitBulk" disabled>確認した内容を一括登録</button><div id="bulkResult"></div>`;
let staged=[];
$('#photoFile').onchange=e=>{const file=e.target.files[0],holder=$('#photoPreview');holder.replaceChildren();if(!file)return;const img=document.createElement('img');img.style='max-width:100%;max-height:340px;border-radius:8px;margin-top:8px';cleanupPreview();if(file.size>15*1024*1024){alert('写真が大きすぎます。15MB以下の写真を選んでください。');return}previewUrl=URL.createObjectURL(file);img.loading='lazy';img.decoding='async';img.src=previewUrl;holder.appendChild(img)};
const invalidate=()=>{$('#commitBulk').disabled=true;staged=[];$('#bulkResult').textContent=''};

$('#previewBulk').onclick=()=>{const date=$('#importDate').value,lines=$('#bulkText').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);if(!date)return alert('配送日を選んでください');if(!lines.length)return alert('配送予定を貼り付けてください');if(lines.length>100)return alert('一度に登録できるのは100件までです');staged=[];const errors=[];lines.forEach((line,i)=>{const cols=line.split(/[｜\t]/).map(x=>x.trim());if(cols.length<3||!cols[1]||!cols[2]){errors.push((i+1)+'行目：配送先または住所がありません');return}const time=cols[0]==='-'?'':cols[0].replace('：',':');if(time&&!/^([01]?\d|2[0-3]):[0-5]\d$/.test(time)){errors.push((i+1)+'行目：時刻の形式が違います');return}staged.push({date,time,place:cols[1],address:cols[2],person:cols[3]||'',phone:cols[4]||'',status:'未着手',note:cols.slice(5).join('｜')})});$('#bulkResult').innerHTML='<h3>登録前の確認：'+staged.length+'件</h3>'+errors.map(e=>'<p style="color:#a43838">'+esc(e)+'</p>').join('')+staged.map((x,i)=>'<div class="entry">'+(i+1)+'. '+esc(x.time)+' '+esc(x.place)+'<div>'+esc(x.address)+'</div><div>'+esc(x.person)+' '+esc(x.phone)+' '+esc(x.note)+'</div></div>').join('');$('#commitBulk').disabled=!!errors.length||!staged.length};
$('#commitBulk').onclick=()=>{if(!staged.length)return;const before=data.schedule.slice();const stamp=Date.now();for(let i=0;i<staged.length;i++)data.schedule.push({...staged[i],id:'import-'+stamp+'-'+i+'-'+Math.random().toString(36).slice(2)});if(!save()){data.schedule=before;return}const count=staged.length;staged=[];alert(count+'件を予定表へ登録しました');show('schedule')};return}
if(tab==='map'){p.innerHTML='<h2>🗺️ マップ</h2><p>配送予定に登録した住所から地図を開けます。自動ルート最適化は未実装です。</p><button class="btn" id="goSchedule">配送予定を開く</button>';$('#goSchedule').onclick=()=>show('schedule');return}if(tab==='backup'){p.innerHTML='<h2>💾 バックアップ</h2><p>この独立試作で入力したデータをJSON形式で保存・復元します。旧アプリのデータを直接読み出す機能ではありません。</p><button class="btn" id="export">JSONを書き出す</button><button class="btn" id="exportCsv">全記録CSVを書き出す</button><label>この試作のJSONを読み込む<input type="file" id="import" accept="application/json,.json"></label><p class="muted">取り込み時は現在の試作データを置き換えます。先に書き出してください。</p>';$('#export').onclick=()=>{const b=new Blob([JSON.stringify({format:'chibari_independent_v1',exportedAt:new Date().toISOString(),data},null,2)],{type:'application/json'});const u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='chibari-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)};$('#exportCsv').onclick=()=>{const rows=[['区分','日付','時刻','名称','住所','担当者','電話','開始','終了','開始km','終了km','休憩分','高速円','給油L','給油円','備考']];for(const type of ['schedule','contacts','addresses','reports'])for(const x of data[type])rows.push([names[type],x.date||'',x.time||'',x.place||x.name||'',x.address||'',x.person||x.driver||'',x.phone||'',x.start||'',x.end||'',x.meterStart||'',x.meterEnd||'',x.breakMinutes||'',x.toll||'',x.fuelLiters||'',x.fuelYen||'',x.note||'']);const csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replaceAll('\"','\"\"')+'"').join(',')).join('\r\n');const u=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=u;a.download='chibari-records-'+today()+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)};$('#import').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let obj=JSON.parse(await f.text());if(obj.format!=='chibari_independent_v1'||!obj.data||!['schedule','contacts','addresses','reports'].every(k=>Array.isArray(obj.data[k])))throw Error('この試作のバックアップ形式ではありません');if(!confirm('現在の試作データを置き換えます。先に現在のJSONバックアップを保存しましたか？'))return;const old=data;data=obj.data;if(!save()){data=old;return}editingId=null;render();alert('読み込み完了')}catch(err){alert('読み込み不可: '+err.message)}};return}let fs=fields[tab];p.innerHTML='<h2>'+names[tab]+'</h2><form id="entryForm">'+fs.map(([k,label,type])=>'<label>'+label+(type==='textarea'?'<textarea name="'+k+'"></textarea>':type==='select'?'<select name="'+k+'"><option value="未着手">未着手</option><option value="配送中">配送中</option><option value="完了">完了</option><option value="持戻り">持戻り</option></select>':'<input name="'+k+'" type="'+type+'" '+(k==='date'?'value="'+today()+'"':'')+'>')+'</label>').join('')+'<button class="btn" type="submit" id="submitButton">登録する</button><button class="btn hide" type="button" id="cancelEdit">編集を取り消す</button></form><h2 style="margin-top:28px">登録一覧（'+data[tab].length+'件）</h2>'+(tab==='schedule'?'<label>日付で絞り込み<input type="date" id="filterDate" value="'+scheduleFilter+'"></label><button type="button" class="btn" id="showAll">全日付を表示</button>':'')+'<div id="items"></div><button type="button" class="btn hide" id="moreItems">さらに40件表示</button>';$('#entryForm').onsubmit=e=>{e.preventDefault();let v=Object.fromEntries(new FormData(e.target).entries());if(!Object.values(v).some(x=>String(x).trim()))return alert('入力してください');if(tab==='reports'&&v.meterStart!==''&&v.meterEnd!==''&&Number(v.meterEnd)<Number(v.meterStart))return alert('終了メーターは開始メーター以上にしてください');const before=JSON.stringify(data[tab]);if(editingId){const idx=data[tab].findIndex(x=>x.id===editingId);if(idx>=0)data[tab][idx]={...data[tab][idx],...v};editingId=null}else{v.id=(typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random());data[tab].push(v)}if(!save()){data[tab]=JSON.parse(before);render();return}render()};const items=$('#items');const filtered=data[tab].filter(x=>tab!=='schedule'||!$('#filterDate')?.value||x.date===$('#filterDate').value);const sorted=filtered.slice().sort((a,b)=>String(b.date||'').localeCompare(String(a.date||''))||String(a.time||'').localeCompare(String(b.time||'')));items.innerHTML=sorted.slice(0,listLimit).map(x=>'<div class="entry"><strong>'+esc(x.place||x.name||x.date||'記録')+'</strong>'+fs.filter(([k])=>x[k]).map(([k,l])=>'<div>'+esc(l)+'：'+esc(x[k])+'</div>').join('')+(x.address?'<a target="_blank" rel="noopener noreferrer" href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(x.address)+'">地図を開く</a>　':'')+(x.phone?'<a href="tel:'+encodeURIComponent(x.phone)+'">電話する</a>　':'')+(tab==='reports'&&x.meterStart!==''&&x.meterEnd!==''?'<div>走行距離：'+(Number(x.meterEnd)-Number(x.meterStart))+'km</div>':'')+'<button class="btn" data-edit="'+esc(x.id)+'">編集</button><button class="btn danger" data-delete="'+esc(x.id)+'">削除</button></div>').join('')||'<p class="muted">まだ登録がありません。</p>';if(tab==='schedule'){$('#filterDate').onchange=()=>{scheduleFilter=$('#filterDate').value;listLimit=40;render()};$('#showAll').onclick=()=>{scheduleFilter='';listLimit=40;render()}}const more=$('#moreItems');if(sorted.length>listLimit){more.classList.remove('hide');more.onclick=()=>{listLimit+=40;render()}}items.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{const x=data[tab].find(x=>x.id===b.dataset.edit);if(!x)return;editingId=x.id;const f=$('#entryForm');for(const [k] of fs)if(f.elements[k])f.elements[k].value=x[k]??'';$('#submitButton').textContent='変更を保存';$('#cancelEdit').classList.remove('hide');f.scrollIntoView();});$('#cancelEdit').onclick=()=>{editingId=null;render()};items.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(confirm('この記録を削除しますか？')){const before=data[tab];data[tab]=data[tab].filter(x=>x.id!==b.dataset.delete);if(!save()){data[tab]=before;render();return}render()}})}function show(t){cleanupPreview();tab=t;listLimit=40;editingId=null;render();window.scrollTo(0,0)}function reportStats(month){const rows=data.reports.filter(x=>String(x.date||'').startsWith(month));const n=x=>Number(x)||0;let distance=0,breaks=0,toll=0,fuel=0,liters=0,minutes=0,deliveryCount=0,constrained=0;for(const r of rows){if(r.meterStart!==''&&r.meterEnd!==''&&r.meterStart!=null&&r.meterEnd!=null)distance+=Math.max(0,n(r.meterEnd)-n(r.meterStart));breaks+=n(r.breakMinutes);deliveryCount+=n(r.deliveryCount);toll+=n(r.toll);fuel+=n(r.fuelYen);liters+=n(r.fuelLiters);if(r.start&&r.end){const [h,m]=r.start.split(':').map(Number),[eh,em]=r.end.split(':').map(Number);let delta=(eh*60+em)-(h*60+m);if(delta<0)delta+=1440;constrained+=delta;minutes+=Math.max(0,delta-n(r.breakMinutes))}}return {rows,days:new Set(rows.map(x=>x.date)).size,distance,breaks,toll,fuel,liters,minutes,deliveryCount,constrained}}
function render(){if(tab!=='monthly'&&tab!=='invoice')return renderBase();const p=$('#panel'),month=today().slice(0,7);if(tab==='monthly'){p.innerHTML='<h2>📊 月次集計</h2><label>対象月<input type="month" id="summaryMonth" value="'+month+'"></label><div id="summaryResult"></div><button class="btn" id="summaryPrint">印刷・PDF保存</button>';const draw=()=>{const v=reportStats($('#summaryMonth').value);$('#summaryResult').innerHTML='<div class="entry"><strong>集計結果（入力済みの日報のみ）</strong><div>稼働日数：'+v.days+'日</div><div>日報：'+v.rows.length+'件</div><div>配送件数：'+v.deliveryCount+'件</div><div>拘束時間：'+(v.constrained/60).toFixed(1)+'時間</div><div>走行距離：'+v.distance.toLocaleString()+' km</div><div>休憩：'+v.breaks+'分</div><div>実働時間：'+(v.minutes/60).toFixed(1)+'時間</div><div>高速代：'+v.toll.toLocaleString()+'円</div><div>給油：'+v.liters.toFixed(1)+'L / '+v.fuel.toLocaleString()+'円</div></div><p class="muted">配送件数は日報に入力された件数を合算。時刻未入力の日報は拘束・実働時間に含まれません。</p>'};$('#summaryMonth').onchange=draw;$('#summaryPrint').onclick=()=>window.print();draw();return}p.innerHTML='<h2>🧾 請求書（簡易作成）</h2><p class="muted">手入力で請求書を作成する試作機能です。日報との自動連動・営業所別の計算規則は未実装です。</p><label>請求先<input id="billTo" placeholder="会社・営業所名"></label><label>請求日<input id="billDate" type="date" value="'+today()+'"></label><label>内容<input id="billDesc" value="配送業務委託料"></label><label>税抜金額（円）<input id="billAmount" type="number" min="0" value="0"></label><label>消費税率<select id="billTax"><option value="0.1">10%</option><option value="0.08">8%</option></select></label><div id="billPreview" class="entry"></div><button class="btn" id="billPrint">印刷・PDF保存</button>';const draw=()=>{const amount=Math.max(0,Number($('#billAmount').value)||0),tax=Math.floor(amount*Number($('#billTax').value));$('#billPreview').innerHTML='<strong>請求書（確認用）</strong><div>宛先：'+esc($('#billTo').value)+'</div><div>請求日：'+esc($('#billDate').value)+'</div><div>内容：'+esc($('#billDesc').value)+'</div><div>税抜：'+amount.toLocaleString()+'円</div><div>消費税：'+tax.toLocaleString()+'円</div><strong>税込合計：'+(amount+tax).toLocaleString()+'円</strong><p class="muted">適格請求書番号、振込先、発行者などは未記載。正式な請求書として送付する前に確認が必要です。</p>'};['billTo','billDate','billDesc','billAmount','billTax'].forEach(id=>$('#'+id).oninput=draw);$('#billPrint').onclick=()=>window.print();draw()}
